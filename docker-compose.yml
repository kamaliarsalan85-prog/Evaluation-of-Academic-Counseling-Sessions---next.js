services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-counseling_eval}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-counseling_eval}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_this_db_password}@db:5432/${POSTGRES_DB:-counseling_eval}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_this_db_password}@db:5432/${POSTGRES_DB:-counseling_eval}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change_this_to_a_long_random_secret_string}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ALLOW_EMBEDDED_DEV_POSTGRES: "false"

volumes:
  pgdata:
